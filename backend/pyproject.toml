[project]
name = "zhixing-backend"
version = "2.0.0"
description = "FastAPI, LangChain and LangGraph backend for Zhixing"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langchain-text-splitters>=1.0,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "pymilvus>=2.6,<3",
  "redis>=6,<8",
  "minio>=7.2,<8",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20",
  "pyyaml>=6,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.13,<5",
  "simpleeval>=1.0,<2",
  "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "docker>=7,<8",
  "rapidocr-onnxruntime>=1.4,<2",
  "pypdfium2>=4,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
ignore = ["B008"]
