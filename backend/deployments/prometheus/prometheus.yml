# Prometheus 抓取配置：采集 Zhixing FastAPI 后端指标（/metrics）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 后端使用 start.ps1 api 或 make run 启动，通过宿主机的 8080 端口访问
  - job_name: nexus-agent
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
