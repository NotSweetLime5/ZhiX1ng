# Grafana 数据源自动配置：Prometheus
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Grafana 容器内访问同 compose 网络的 prometheus 服务
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
